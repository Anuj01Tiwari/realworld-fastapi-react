version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: realworld_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: realworld
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: realworld_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/realworld
      SECRET_KEY: realworld-super-secret-jwt-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: realworld_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
